name: Tests
on: [push, pull_request]
jobs:
  compatibility:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        environment: [default, minimum]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.81.0
          environments: ${{ matrix.environment }}
          locked: true
      - run: pixi run -e ${{ matrix.environment }} check
      - run: pixi run -e ${{ matrix.environment }} build
      - run: pixi run -e ${{ matrix.environment }} check-dist
